name: questly-platform-coolify

x-api-environment: &api-environment
  DATABASE_URL: postgres://${DB_USER:-questly}:${DB_PASSWORD:-questly}@postgres:5432/${DB_NAME:-questly}
  PORT: ${API_PORT:-3000}
  JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-string}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-questly_auth}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
  ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Game Admin}
  DB_USER: ${DB_USER:-questly}
  DB_PASSWORD: ${DB_PASSWORD:-questly}
  DB_NAME: ${DB_NAME:-questly}
  FRONTEND_URL: ${FRONTEND_URL:-https://fckc40wwc4c8g8ws8o4g48o8.217.216.43.183.sslip.io}
  APP_BASE_URL: ${APP_BASE_URL:-https://fckc40wwc4c8g8ws8o4g48o8.217.216.43.183.sslip.io}
  ALLOW_ANY_ORIGIN: ${ALLOW_ANY_ORIGIN:-false}
  REALM_SLUG: ${REALM_SLUG:-questly-home}
  REALM_NAME: ${REALM_NAME:-Questly}
  SKIP_ONBOARDING_PLAYER_PASSWORD: ${SKIP_ONBOARDING_PLAYER_PASSWORD:-questly-player}
  SKIP_ONBOARDING_THEME_KEY: ${SKIP_ONBOARDING_THEME_KEY:-couples-glow}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Questly}
  EMAIL_VERIFICATION_EXPIRY_HOURS: ${EMAIL_VERIFICATION_EXPIRY_HOURS:-24}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_REGION: ${AWS_REGION:-}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_AVATAR_PREFIX: ${S3_AVATAR_PREFIX:-avatars}
  S3_CONTENT_PREFIX: ${S3_CONTENT_PREFIX:-content}
  S3_MEDIA_PREFIX: ${S3_MEDIA_PREFIX:-wins}
  S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-900}
  PASSWORD_HASH_ROUNDS: ${PASSWORD_HASH_ROUNDS:-12}
  TASK_EXPIRY_SWEEP_INTERVAL_MS: ${TASK_EXPIRY_SWEEP_INTERVAL_MS:-300000}
  TASK_RUN_MEDIA_PROCESSING_INTERVAL_MS: ${TASK_RUN_MEDIA_PROCESSING_INTERVAL_MS:-15000}
  TASK_RUN_MEDIA_PROCESSING_BATCH_SIZE: ${TASK_RUN_MEDIA_PROCESSING_BATCH_SIZE:-3}
  TASK_RUN_MEDIA_PROCESSING_LOCK_TIMEOUT_MS: ${TASK_RUN_MEDIA_PROCESSING_LOCK_TIMEOUT_MS:-120000}
  TASK_RUN_MEDIA_PROCESSING_MAX_ATTEMPTS: ${TASK_RUN_MEDIA_PROCESSING_MAX_ATTEMPTS:-12}
  NODE_ENV: production
  COOKIE_SECURE: ${COOKIE_SECURE:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-questly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-questly}
      POSTGRES_DB: ${DB_NAME:-questly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-questly} -d ${DB_NAME:-questly}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: always
    environment: *api-environment
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const http=require('http'); const req=http.get('http://127.0.0.1:'+(process.env.PORT||3000)+'/health',(res)=>process.exit(res.statusCode===200?0:1)); req.on('error',()=>process.exit(1)); req.setTimeout(5000,()=>{req.destroy();process.exit(1);});"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${API_PORT:-3000}"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
